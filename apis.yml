aid: sword
name: Sword
description: >-
  Sword Health is a digital health company delivering AI-powered virtual care
  for musculoskeletal (MSK) pain, pelvic health, and injury prevention. Founded
  in 2015 in Portugal by Virgilio Bento, Sword pairs licensed physical
  therapists with motion-sensor and computer-vision technology so members can
  complete clinically supervised physical therapy from home. Its platform spans
  an enrollment platform, a treatment platform, a mobile application backed by a
  mobile API, a file-exchange platform for enterprise clients, and an AI care
  system. Sword serves 1,000+ enterprise and health-plan clients across three
  continents, is backed by investors including General Catalyst, Khosla
  Ventures, Founders Fund, and Transformation Capital, and maintains SOC 2 Type
  2, HITRUST, ISO 13485, HIPAA, GDPR, and Cyber Essentials compliance. Sword
  does not currently publish a public developer API program; this profile
  captures its identity, status, security, and compliance surface.
